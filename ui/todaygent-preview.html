<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todaygent Animation Preview</title>
<style>
/* ── Page layout ─────────────────────────────────────────────────────────── */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f5f3f0;
  color: #2a2a2a;
  padding: 2rem;
  transition: background 0.3s, color 0.3s;
}
body.dark {
  background: #1a1a1a;
  color: #e0e0e0;
}
h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
.controls {
  display: flex; gap: 0.5rem; flex-wrap: wrap;
  margin-bottom: 2rem; align-items: center;
}
.controls button {
  padding: 0.4rem 1rem; border: 1px solid #ccc; border-radius: 6px;
  background: #fff; cursor: pointer; font-size: 0.85rem;
  transition: background 0.15s;
}
.controls button:hover { background: #eee; }
.controls button.active {
  background: #3D2E1F; color: #fff; border-color: #3D2E1F;
}
body.dark .controls button { background: #333; color: #ddd; border-color: #555; }
body.dark .controls button:hover { background: #444; }
body.dark .controls button.active { background: #FFBF2E; color: #1a1a1a; border-color: #FFBF2E; }

.preview-grid {
  display: flex; gap: 3rem; flex-wrap: wrap; align-items: flex-start;
}
.preview-card {
  display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
  padding: 1.5rem; border: 1px solid #ddd; border-radius: 12px;
  background: #fff; min-width: 160px;
  transition: background 0.3s, border-color 0.3s;
}
body.dark .preview-card { background: #222; border-color: #444; }
.preview-card__label {
  font-size: 0.75rem; color: #888; text-transform: uppercase;
  letter-spacing: 0.06em;
}
.preview-card__size { font-size: 0.65rem; color: #aaa; }
.preview-card__mascot {
  display: flex; align-items: center; justify-content: center;
  min-height: 80px;
}
.zoomed {
  display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
  padding: 2rem; border: 1px solid #ddd; border-radius: 12px;
  background: #fff; transition: background 0.3s, border-color 0.3s;
}
body.dark .zoomed { background: #222; border-color: #444; }
.zoomed__label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.06em; }

/* ── Todaygent CSS (copied from TodogentMascot.css) ──────────────────────── */

.todaygent-mascot .todaygent-face,
.todaygent-mascot .eyelid-top,
.todaygent-mascot .eyelid-bottom,
.todaygent-mascot .eye-left,
.todaygent-mascot .eye-right,
.todaygent-mascot .sparkle-1,
.todaygent-mascot .sparkle-2,
.todaygent-mascot .sparkle-3,
.todaygent-mascot .indicator-dot {
  transform-box: fill-box;
  transform-origin: center;
}

.todaygent-mascot .mouth-thinking,
.todaygent-mascot .mouth-pursed { display: none; }

.todaygent-mascot .eyelid-top {
  transform-origin: center bottom;
  transform: scaleY(0);
}
.todaygent-mascot .eyelid-bottom {
  transform-origin: center top;
  transform: scaleY(0);
}

.todaygent--compact .todaygent-indicators,
.todaygent--compact .todaygent-sparkles { display: none; }

/* ── Idle ── */
.todaygent--idle .sparkle-1 { animation: todaygent-twinkle 3s ease-in-out infinite; }
.todaygent--idle .sparkle-2 { animation: todaygent-twinkle 3s ease-in-out 1s infinite; }
.todaygent--idle .sparkle-3 { animation: todaygent-twinkle 3s ease-in-out 2s infinite; }
@keyframes todaygent-twinkle {
  0%, 100% { opacity: 0.2; transform: scale(0.5); }
  50% { opacity: 1; transform: scale(1.1); }
}
.todaygent--idle .eyelid-top,
.todaygent--idle .eyelid-bottom { animation: todaygent-blink 6s ease-in-out infinite; }
@keyframes todaygent-blink {
  0%, 85%, 93%, 100% { transform: scaleY(0); }
  88%, 90% { transform: scaleY(1); }
}
.todaygent--idle .indicator-dot--1 { animation: todaygent-dot-green 4s ease-in-out infinite; }
.todaygent--idle .indicator-dot--2 { animation: todaygent-dot-gold 4s ease-in-out 1.3s infinite; }
.todaygent--idle .indicator-dot--3 { animation: todaygent-dot-teal 4s ease-in-out 2.6s infinite; }
@keyframes todaygent-dot-green { 0%, 100% { fill: #4A8B4A; } 50% { fill: #C0392B; } }
@keyframes todaygent-dot-gold { 0%, 100% { fill: #FFBF2E; } 50% { fill: #4A8B4A; } }
@keyframes todaygent-dot-teal { 0%, 100% { fill: #7A9C9F; } 50% { fill: #FFBF2E; } }

/* ── Thinking ── */

/* Mouth expression cycle */
.todaygent--thinking .mouth-thinking {
  display: inline;
  animation: todaygent-mouth-thinking 6s step-end infinite;
}
.todaygent--thinking .mouth-neutral {
  animation: todaygent-mouth-neutral 6s step-end infinite;
}
.todaygent--thinking .mouth-pursed {
  display: inline;
  animation: todaygent-mouth-pursed 6s step-end infinite;
}
@keyframes todaygent-mouth-thinking {
  0%, 40% { opacity: 1; }
  41%, 95% { opacity: 0; }
  96%, 100% { opacity: 1; }
}
@keyframes todaygent-mouth-neutral {
  0%, 40% { opacity: 0; }
  41%, 70% { opacity: 1; }
  71%, 100% { opacity: 0; }
}
@keyframes todaygent-mouth-pursed {
  0%, 70% { opacity: 0; }
  71%, 95% { opacity: 1; }
  96%, 100% { opacity: 0; }
}

/* Head turn */
.todaygent--thinking .todaygent-face {
  animation: todaygent-head-turn 8s ease-in-out infinite;
}
@keyframes todaygent-head-turn {
  0%, 70% { transform: translateX(0); }
  74%, 82% { transform: translateX(2px); }
  86%, 100% { transform: translateX(0); }
}

/* Side-eye squint */
.todaygent--thinking .eye-left,
.todaygent--thinking .eye-right { animation: todaygent-side-eye 8s ease-in-out infinite; }
@keyframes todaygent-side-eye {
  0%, 70% { transform: translateX(0) scaleY(1); }
  74% { transform: translateX(5px) scaleY(0.35); }
  75%, 82% { transform: translateX(5px) scaleY(0.35); }
  86%, 100% { transform: translateX(0) scaleY(1); }
}

/* Thinking blink */
.todaygent--thinking .eyelid-top,
.todaygent--thinking .eyelid-bottom { animation: todaygent-blink 4s ease-in-out infinite; }

/* Thinking sparkle + indicators */
.todaygent--thinking .sparkle-1 { animation: todaygent-twinkle 2s ease-in-out infinite; }
.todaygent--thinking .indicator-dot--1 { animation: todaygent-dot-green 1.5s ease-in-out infinite; }
.todaygent--thinking .indicator-dot--2 { animation: todaygent-dot-gold 1.5s ease-in-out 0.5s infinite; }
.todaygent--thinking .indicator-dot--3 { animation: todaygent-dot-teal 1.5s ease-in-out 1s infinite; }

/* ── Dark mode ── */
body.dark .todaygent-mascot {
  filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.5));
}
</style>
</head>
<body>
<h1>Todaygent Animation Preview</h1>
<div class="controls">
  <button onclick="setState('idle')" id="btn-idle" class="active">Idle</button>
  <button onclick="setState('thinking')" id="btn-thinking">Thinking</button>
  <button onclick="setState('static')" id="btn-static">Static</button>
  <span style="color:#aaa; margin: 0 0.5rem;">|</span>
  <button onclick="toggleDark()" id="btn-dark">Toggle Dark Mode</button>
</div>

<div class="preview-grid">
  <div class="preview-card">
    <span class="preview-card__label">Compact (chat inline)</span>
    <span class="preview-card__size">40px — as used in chat</span>
    <div class="preview-card__mascot" id="mascot-40"></div>
  </div>

  <div class="preview-card">
    <span class="preview-card__label">Welcome</span>
    <span class="preview-card__size">100px — welcome screen</span>
    <div class="preview-card__mascot" id="mascot-100"></div>
  </div>

  <div class="zoomed">
    <span class="zoomed__label">Zoomed (200px) — for evaluating expressions</span>
    <div id="mascot-200"></div>
  </div>
</div>

<script>
function makeSVG(size, state) {
  const isCompact = size <= 48;
  const viewBox = isCompact ? "0 0 100 76" : "0 0 100 116";
  const ratio = isCompact ? 76/100 : 116/100;
  const stateClass = state !== "static" ? `todaygent--${state}` : "";
  const compactClass = isCompact ? "todaygent--compact" : "";
  const boardH = isCompact ? 52 : 88;
  const paperH = isCompact ? 38 : 74;

  return `<svg viewBox="${viewBox}" width="${size}" height="${size * ratio}"
    class="todaygent-mascot ${stateClass} ${compactClass}" role="img" aria-label="Todaygent">
    <g class="todaygent-body">
      <rect x="16" y="22" width="68" height="${boardH}" rx="10" ry="10" fill="#3D2E1F"/>
    </g>
    <rect x="22" y="30" width="56" height="${paperH}" rx="6" ry="6" fill="#FAF8F5"/>
    <rect x="28" y="34" width="44" height="32" rx="8" ry="8" fill="#E5DDD3"/>
    <g class="todaygent-clip">
      <rect x="35" y="16" width="30" height="10" rx="5" ry="5" fill="#8C8C8C"/>
      <rect x="41" y="19" width="18" height="5" rx="2.5" ry="2.5" fill="#B8B8B8"/>
    </g>
    <g class="todaygent-face">
      <circle class="eye-left" cx="41" cy="46" r="3.5" fill="#3D2E1F"/>
      <circle class="eye-right" cx="59" cy="46" r="3.5" fill="#3D2E1F"/>
      <path class="mouth-neutral" d="M44,55 Q50,60 56,55" fill="none" stroke="#3D2E1F" stroke-width="2" stroke-linecap="round"/>
      <path class="mouth-thinking" d="M43,56 L57,56" fill="none" stroke="#3D2E1F" stroke-width="2" stroke-linecap="round"/>
      <path class="mouth-pursed" d="M45,56 Q50,57.5 55,56" fill="none" stroke="#3D2E1F" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g class="todaygent-eyelids">
      <rect class="eyelid-top eyelid-top--left" x="35.5" y="40.5" width="11" height="5.5" rx="2" fill="#E5DDD3"/>
      <rect class="eyelid-bottom eyelid-bottom--left" x="35.5" y="46" width="11" height="5.5" rx="2" fill="#E5DDD3"/>
      <rect class="eyelid-top eyelid-top--right" x="53.5" y="40.5" width="11" height="5.5" rx="2" fill="#E5DDD3"/>
      <rect class="eyelid-bottom eyelid-bottom--right" x="53.5" y="46" width="11" height="5.5" rx="2" fill="#E5DDD3"/>
    </g>
    <g class="todaygent-indicators">
      <circle class="indicator-dot indicator-dot--1" cx="31" cy="76" r="2.5" fill="#4A8B4A"/>
      <rect x="37" y="74" width="28" height="4" rx="2" fill="#D4C9BC"/>
      <circle class="indicator-dot indicator-dot--2" cx="31" cy="85" r="2.5" fill="#FFBF2E"/>
      <rect x="37" y="83" width="22" height="4" rx="2" fill="#D4C9BC"/>
      <circle class="indicator-dot indicator-dot--3" cx="31" cy="94" r="2.5" fill="#7A9C9F"/>
      <rect x="37" y="92" width="25" height="4" rx="2" fill="#D4C9BC"/>
    </g>
    <g class="todaygent-sparkles">
      <path class="sparkle-1" d="M87,37 L90,44 L93,37 L100,34 L93,31 L90,24 L87,31 L80,34 Z" fill="#FFBF2E"/>
      <path class="sparkle-2" d="M8,28 L10,33 L12,28 L17,26 L12,24 L10,19 L8,24 L3,26 Z" fill="#FFB800"/>
      <path class="sparkle-3" d="M85,80 L86.5,84 L88,80 L92,78.5 L88,77 L86.5,73 L85,77 L81,78.5 Z" fill="#FFBF2E"/>
    </g>
  </svg>`;
}

let currentState = "idle";
const sizes = [40, 100, 200];
const containers = ["mascot-40", "mascot-100", "mascot-200"];

function render() {
  containers.forEach((id, i) => {
    document.getElementById(id).innerHTML = makeSVG(sizes[i], currentState);
  });
}

function setState(s) {
  currentState = s;
  document.querySelectorAll(".controls button:not(#btn-dark)").forEach(b => b.classList.remove("active"));
  document.getElementById("btn-" + s).classList.add("active");
  render();
}

function toggleDark() {
  document.body.classList.toggle("dark");
}

render();
</script>
</body>
</html>
