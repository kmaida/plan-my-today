<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116" width="100" height="116">
  <style>
    .eyelid-left,
    .eyelid-right,
    .sparkle-1,
    .sparkle-2,
    .sparkle-3,
    .indicator-dot {
      transform-box: fill-box;
      transform-origin: center;
    }

    .mouth-smirk { display: none; }

    /* Idle animation (default for standalone SVG) */
    .sparkle-1 { animation: twinkle 3s ease-in-out infinite; }
    .sparkle-2 { animation: twinkle 3s ease-in-out 1s infinite; }
    .sparkle-3 { animation: twinkle 3s ease-in-out 2s infinite; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1); }
    }

    .eyelid-left,
    .eyelid-right {
      animation: blink 6s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 87%, 100% { transform: scaleY(0); }
      89% { transform: scaleY(1); }
    }

    .indicator-dot--1 { animation: dot-green 4s ease-in-out infinite; }
    .indicator-dot--2 { animation: dot-gold 4s ease-in-out 1.3s infinite; }
    .indicator-dot--3 { animation: dot-teal 4s ease-in-out 2.6s infinite; }

    @keyframes dot-green {
      0%, 100% { fill: #4A8B4A; }
      50% { fill: #C0392B; }
    }

    @keyframes dot-gold {
      0%, 100% { fill: #FFBF2E; }
      50% { fill: #4A8B4A; }
    }

    @keyframes dot-teal {
      0%, 100% { fill: #7A9C9F; }
      50% { fill: #FFBF2E; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sparkle-1, .sparkle-2, .sparkle-3,
      .eyelid-left, .eyelid-right,
      .indicator-dot {
        animation: none !important;
      }
    }
  </style>

  <!-- Clipboard body (dark brown board) -->
  <rect x="16" y="22" width="68" height="88" rx="10" ry="10" fill="#3D2E1F"/>

  <!-- Paper inset (cream) -->
  <rect x="22" y="30" width="56" height="74" rx="6" ry="6" fill="#FAF8F5"/>

  <!-- Face screen (warm beige, distinct from cream paper) -->
  <rect x="28" y="34" width="44" height="32" rx="8" ry="8" fill="#E5DDD3"/>

  <!-- Clip "hat" (silver metal, proportionally smaller) -->
  <rect x="35" y="16" width="30" height="10" rx="5" ry="5" fill="#8C8C8C"/>
  <rect x="41" y="19" width="18" height="5" rx="2.5" ry="2.5" fill="#B8B8B8"/>

  <!-- Eyes -->
  <circle cx="41" cy="46" r="3.5" fill="#3D2E1F"/>
  <circle cx="59" cy="46" r="3.5" fill="#3D2E1F"/>

  <!-- Neutral mouth -->
  <path class="mouth-neutral" d="M44,55 Q50,60 56,55" fill="none" stroke="#3D2E1F" stroke-width="2" stroke-linecap="round"/>
  <!-- Smirk mouth (hidden) -->
  <path class="mouth-smirk" d="M43,55 Q49,60 55,54.5 Q57,53.5 59,53" fill="none" stroke="#3D2E1F" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyelids (same color as face screen) -->
  <rect class="eyelid-left" x="35.5" y="40.5" width="11" height="11" rx="2" fill="#E5DDD3"/>
  <rect class="eyelid-right" x="53.5" y="40.5" width="11" height="11" rx="2" fill="#E5DDD3"/>

  <!-- Status-light indicators (colored dot + line) -->
  <circle class="indicator-dot indicator-dot--1" cx="31" cy="76" r="2.5" fill="#4A8B4A"/>
  <rect x="37" y="74" width="28" height="4" rx="2" fill="#D4C9BC"/>

  <circle class="indicator-dot indicator-dot--2" cx="31" cy="85" r="2.5" fill="#FFBF2E"/>
  <rect x="37" y="83" width="22" height="4" rx="2" fill="#D4C9BC"/>

  <circle class="indicator-dot indicator-dot--3" cx="31" cy="94" r="2.5" fill="#7A9C9F"/>
  <rect x="37" y="92" width="25" height="4" rx="2" fill="#D4C9BC"/>

  <!-- Ambient sparkles -->
  <path class="sparkle-1" d="M87,37 L90,44 L93,37 L100,34 L93,31 L90,24 L87,31 L80,34 Z" fill="#FFBF2E"/>
  <path class="sparkle-2" d="M8,28 L10,33 L12,28 L17,26 L12,24 L10,19 L8,24 L3,26 Z" fill="#FFB800"/>
  <path class="sparkle-3" d="M85,80 L86.5,84 L88,80 L92,78.5 L88,77 L86.5,73 L85,77 L81,78.5 Z" fill="#FFBF2E"/>
</svg>
