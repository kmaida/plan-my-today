<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Clipboard board (solid dark brown) -->
  <rect x="64" y="40" width="352" height="432" rx="24" ry="24" fill="#3D2E1F"/>

  <!-- Paper (slightly inset, sitting on top of clipboard) -->
  <rect x="88" y="72" width="304" height="380" rx="12" ry="12" fill="#FAF8F5"/>

  <!-- Clipboard top clip (silver metal) -->
  <rect x="162" y="14" width="156" height="62" rx="16" ry="16" fill="#8C8C8C"/>
  <rect x="186" y="28" width="108" height="34" rx="10" ry="10" fill="#B8B8B8"/>

  <!-- Task lines (simplified for mid-size rendering) -->
  <rect x="120" y="120" width="240" height="14" rx="7" ry="7" fill="#D4C9BC"/>
  <rect x="120" y="168" width="200" height="14" rx="7" ry="7" fill="#D4C9BC"/>
  <rect x="120" y="216" width="220" height="14" rx="7" ry="7" fill="#D4C9BC"/>
  <rect x="120" y="264" width="180" height="14" rx="7" ry="7" fill="#D4C9BC"/>

  <!-- AI badge — extra large for small-render readability -->
  <rect x="240" y="220" width="230" height="210" rx="52" ry="52" fill="#3D2E1F"/>

  <!-- Single sparkle on badge (bold, centered on badge) -->
  <path d="M340,340 L355,400 L370,340 L430,325 L370,310 L355,250 L340,310 L280,325 Z" fill="none" stroke="#2A1F14" stroke-width="8" stroke-linejoin="round"/>
  <path d="M340,340 L355,400 L370,340 L430,325 L370,310 L355,250 L340,310 L280,325 Z" fill="#FFB800"/>
</svg>
